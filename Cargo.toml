[package]
name = "autocomic-rss"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "A Rust RSS subscription and download automation service"

[dependencies]
actix-web = "4.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "signal", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "multipart", "socks"] }
scraper = "0.24"
cap-std = "4.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "migrate", "macros"] }
feed-rs = "2.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha1 = "0.10"
bendy = "0.3"
data-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
